<style>

@media(prefers-reduced-motion:reduce){#questionHunterPanel *{animation:none!important;transition:none!important}}

<body>

 <div class="header"><h1 id="stTitle">⏳ جاري تحميل ورقة العمل...</h1><p>بوابة الطالب — نظام النقاط والتحفيز المدرسي</p></div>

  <div id="questionHunterAvailabilityMsg" style="display:none;margin-top:8px;padding:10px;border-radius:10px;background:#eff6ff;color:#1e40af;font-size:13px;text-align:center;line-height:1.7"></div>

 </div>

 <button type="button" class="action-btn" onclick="openDailyChallenge()" style="width:100%;margin-top:10px;background:linear-gradient(135deg,#ea580c,#f59e0b);color:white">🔥 تحدي اليوم</button><div id="studentHomeworkHonorBoardSuccess" style="display:none;margin-top:16px;padding:16px;border-radius:16px;background:linear-gradient(135deg,#fffbeb,#fef3c7);text-align:right"></div></div>

<script>
// Firebase client setup for the dedicated student portal.
const firebaseConfig = {
  apiKey: "AIzaSyCAeHOVGUpG7WcPcUh0XtBvmTwLGdcBCJE",
  authDomain: "school-points-qatar.firebaseapp.com",
  projectId: "school-points-qatar",
  storageBucket: "school-points-qatar.firebasestorage.app",
  messagingSenderId: "689880020347",
  appId: "1:689880020347:web:24305b6f89ac3448acb9de"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const firestoreDb = firebase.firestore();


// ==================== محرك صفحة الطالب (مدمج) ====================
// هذا الكود يجعل لوحة المدير تتحول إلى صفحة طالب إذا كان الرابط يحتوي على ?student

// تهيئة بوابة الطالب المستقلة: نستخدم عناصر الصفحة الموجودة دون إنشاء واجهة مكررة.
setTimeout(() => {
    const urlParams = new URLSearchParams(window.location.search);
    const isStudentMode = window.location.hostname.toLowerCase() === 'student.abuhazem.com'
        || urlParams.get('student') === 'true';
    if (!isStudentMode) return;

    const worksheetId = urlParams.get('id');
    const titleEl = document.getElementById('stTitle');
    const startBtn = document.getElementById('stStartBtn');

    if (!worksheetId) {
        if (titleEl) titleEl.innerText = 'بوابة الطالب — أدخل بياناتك لفتح ورقة العمل أو تحدي اليوم';
        if (startBtn) {
            startBtn.disabled = true;
            startBtn.textContent = 'افتح رابط ورقة العمل أولاً';
        }
        return;
    }

    if (titleEl) titleEl.innerText = '⏳ جاري تحميل ورقة العمل...';
    firestoreDb.collection('worksheets').doc(worksheetId).get().then(doc => {
        if (doc.exists) {
            window.currentStudentWorksheet = doc.data();
            if (titleEl) titleEl.innerText = window.currentStudentWorksheet.title || 'ورقة العمل';
            if (startBtn) {
                startBtn.disabled = false;
                startBtn.textContent = '🚀 ابدأ الإجابة';
            }
        } else {
            if (titleEl) titleEl.innerText = '❌ الورقة غير موجودة أو تم حذفها';
            if (startBtn) {
                startBtn.disabled = true;
                startBtn.textContent = 'الورقة غير متاحة';
            }
        }
    }).catch(err => {
        if (titleEl) titleEl.innerText = '❌ تعذر تحميل بيانات الورقة. تحقق من الاتصال وصلاحيات Firestore.';
        if (startBtn) {
            startBtn.disabled = true;
            startBtn.textContent = 'تعذر التحميل';
        }
        console.error('Worksheet Firestore read error:', err);
    });
}, 150);
// أسماء الطلاب الموزعة حسب الصف من ملف Student Names.xlsx
const STUDENT_NAMES_BY_CLASS = {"السادس 2":["أحمد عمر احمد عبدالرحمن الجهرمى","احمد الامين احمد الامين","احمد على فالح الجمل","احمد غلام احمد تاج كاركشا","السمؤال عبدالمسامح الزين النور","الهادي سمير الحاج عبدالله","انس اشرف انيس شاهين","تميم المعتزبالله عادل احمد البحلس","جاسم احمد صالح عبدالله السحيقى","جاسم محمد فاضل الشقيرى المهندى","حمد محمد فاروق","خالد سعيد عبد الحميد عبد الغفار محمد","خالد عبدالعزيز","خالد محمد خالد القوربه","ريان احمد سفيان الجمل","ريان بشار حمزه","زياد بوحده","سليمان زياد سليمان عبدالخالق","صالح احمد عبدالقادر حموده","صالح عون علي محمد القمش","عمر يونس الشلوت","عناب معتصم اسامه عناب","فهد احمد ابراهيم حمد الطوالبة","مؤتمن منتصر يعقوب عبدالقادر احمد","مالك عزام ذياب عبدالمالك","محمد شوقي قاسم فاضل","محمد عبدالله","محمد عيسى احمد محمد الحمادى","محمد كريم محمد على حسن طه","مسعود احمد مسعود العبري","هزاع جمال علي الجعل","ياسين عماد مسعد حامد الصباغ","يحيى احمد عاطف عبدالسلام العبد"],"السادس 4":["أحمد يوسف أحمد عبد الله العبدلي","أواب ابوالقاسم حسن جادالله","احمد خليفة سالم المحروقي","الياس محمد زين دغمش","باسل عمار ياسر احمد محمود","براء فوزي بلدي","بلال محمد محمد محمد حسين","تميم عبدالله سلطان على العلى","حمزة امير السيد عثمان محمد","حمزه شادى عبدالكريم قاسم","خليفه محمد قائد علي العتولى","راشد احمد راشد على الشرشنى","ضياء الدين هشام النيل سعيد","عبدالله عبدالعزيز على ال شاهين السليطى","عبدالهادى سليمان الهادي اسحق","عمر محمد احمد حسين","غانم يحيى صالح عبدالله العبيدى","فهد عبدالعليم","فواز فيصل ادهام فيصل المهندى","كنان فادي مروان الرواشده","مالك محمد انس الفوال","محمد الخواض محمدالامين محمدنور","محمد سيف الرحمن عبدالمنعم حسين حنفى","محمد عبدالناصر ثابت الفتى","معاذ محمد احمد عواد احمد","ناجي ياسين العلي","نصر موفق نصر جوهره","هيثم علي محمد الرقب","ورد نورالدين العسلى","وليد عاقب فيصل على","يمان عمر محمدعبدالوهاب ابوشريعه","يوسف اشرف مصطفي محمد علي","يوسف عصام يوسف بابكر"],"السادس 6":["احمد علي حسن الصائغ","احمد محمد على سيد","بهاء محمد عبدالحميد الشاقلدي","تميم حسين زين عبدالناصر السعدى","حسام احمد جبريل حبيب","ريان بشير حسن الروسان","سعد بدر عبدالله حسين البلوشى","عاطف الله توصيف الله","عبدالرحمن رشيد عبدالرشيد","عبدالرحمن محمد محمود محمد ابووطفه","عبدالرحمن محمد هيثم محسن","عزالدين محمد عيد زكي على","على ابراهيم سعيد مخيمر","على اسلام على كامل سويفى","علي حسن على سويد المالكى","عمار سعيد محمد علي اسعد","عمر أحمد بدر ابوالمجد النجار","فيصل محمد المحمد الظاهر الحمد","قصي محمد عبدالله عبدالقوي محمد","مبارك خالد مسعود جوهر العبدالله","محمد ديسم منتصر مفتاح","محمد عبدالرحمن على برات حمزوي","محمد عبدالله موسى العبسي","محمد عبدالله يوسف موسى","محمد عمر احمد الشيخ","محمد عمر سالم الزاكى","محمد عمر عبدي","محمد عمر موسى الجراجره","محمد لؤي وسوف","محمد ناهض مسعود الحداد","محمدعثمان زكريا محمد زكريا","هذال فهد سيدهاشم سيدمحمد الهاشمى","يوسف ابراهيم عبدالله حاجى الخورى"]};
window.populateStudentNames = function() {
  const cls = document.getElementById('stClass').value;
  const nameSelect = document.getElementById('stName');
  nameSelect.innerHTML = '';
  if (!cls || !STUDENT_NAMES_BY_CLASS[cls]) {
    nameSelect.disabled = true;
    nameSelect.innerHTML = '<option value="">-- اختر الصف أولاً --</option>';
    return;
  }
  nameSelect.disabled = false;
  nameSelect.innerHTML = '<option value="">-- اختر اسم الطالب --</option>';
  STUDENT_NAMES_BY_CLASS[cls].forEach(name => {
    const option = document.createElement('option');
    option.value = name; option.textContent = name;
    nameSelect.appendChild(option);
  });
};
// دوال الطالب
async function homeworkSha256(value) {
    const bytes = new TextEncoder().encode(String(value));
    const digest = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function homeworkNormalizeName(value) {
    return String(value || '').trim().replace(/\s+/g,' ').toLowerCase();
}
window.__worksheetTimerHandle = null;
window.__worksheetTimeExpired = false;
function stopStudentWorksheetTimer(){
    if(window.__worksheetTimerHandle){clearInterval(window.__worksheetTimerHandle);window.__worksheetTimerHandle=null;}
}
function runStudentWorksheetTimer(expiresAtMillis){
    stopStudentWorksheetTimer();
    const panel=document.getElementById('stTimerPanel');
    const value=document.getElementById('stTimerValue');
    if(!panel||!value||!Number.isFinite(Number(expiresAtMillis)))return;
    panel.style.display='block';
    const tick=()=>{
        const left=Math.max(0,Math.ceil((Number(expiresAtMillis)-Date.now())/1000));
        value.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
        if(left<=0){
            stopStudentWorksheetTimer();
            window.__worksheetTimeExpired=true;
            const msg=document.getElementById('stTimingMessage');
            if(msg){msg.style.display='block';msg.textContent='انتهى وقت المحاولة. جارٍ إرسال إجاباتك تلقائيًا.';}
            window.submitStudentAnswers(true);
        }
    };
    tick();window.__worksheetTimerHandle=setInterval(tick,1000);
}
window.startStudentWorksheet = async function() {
    const cls = document.getElementById('stClass').value;
    const name = document.getElementById('stName').value;
    const pin = (document.getElementById('stPin') && document.getElementById('stPin').value || '').trim();
    const startBtn=document.getElementById('stStartBtn');
    if(!cls || !name) return alert('الرجاء اختيار الصف واسم الطالب من القائمة');
    if(!/^\d{4}$/.test(pin)) return alert('أدخل الرقم السري المكوّن من 4 أرقام.');
    if(!window.currentStudentWorksheet || !window.currentStudentWorksheet.imageUrl) return alert('لم يتم تحميل صورة ورقة العمل بعد. يرجى تحديث الصفحة والمحاولة مرة أخرى.');
    const schoolId = String(window.currentStudentWorksheet.schoolId || 'global');
    const studentKey = await homeworkSha256(schoolId + '|' + cls + '|' + homeworkNormalizeName(name));
    const pinHash = await homeworkSha256(studentKey + '|' + pin);
    const worksheetId = new URLSearchParams(window.location.search).get('id');
    if (!worksheetId) return alert('تعذر تحديد ورقة العمل. افتح الرابط المرسل من المعلم مرة أخرى.');
    if(startBtn){startBtn.disabled=true;startBtn.textContent='⏳ جارٍ التحقق من الموعد والرقم السري...';}
    try {
        // يتحقق الخادم مباشرة من student_access عبر Admin SDK؛ لا نحتاج كتابة
        // سجل student_pin_checks من جهاز الطالب في كل محاولة.
        const callable=firebase.app().functions('us-central1').httpsCallable('startStudentWorksheetAttempt');
        const response=await callable({worksheetId,schoolId,studentKey,pinHash,studentName:name,studentClass:cls});
        const result=response&&response.data?response.data:{};
        if(result.success!==true)throw new Error('لم يؤكد الخادم بدء المحاولة.');
        window.currentStudentIdentity={schoolId,studentKey,pinHash,studentName:name,studentClass:cls};
        window.currentStudentAttemptId=String(result.attemptId||'');
        window.__worksheetTimeExpired=false;
        document.getElementById('stInfoForm').style.display='none';
        document.getElementById('stWorkspace').style.display='block';
        document.getElementById('stSubmitArea').style.display='block';
        if(result.expiresAtMillis)runStudentWorksheetTimer(Number(result.expiresAtMillis));
        const img=document.getElementById('stImg');
        img.onload=()=>{
            const fieldsDiv=document.getElementById('stFields');fieldsDiv.innerHTML='';
            window.currentStudentWorksheet.fields.forEach(f=>{
                const el=document.createElement('div');
                const renderedImage=document.getElementById('stImg');
                const editorWidth=Number(window.currentStudentWorksheet.editorImageWidth||0);
                const scale=(renderedImage&&editorWidth>0)?renderedImage.clientWidth/editorWidth:1;
                const fieldWidth=Number(f.wPct)>0?f.wPct+'%':(Number(f.w||0)*scale)+'px';
                const fieldHeight=Number(f.hPct)>0?f.hPct+'%':(Number(f.h||0)*scale)+'px';
                el.style.cssText=`position:absolute;box-sizing:border-box;background:#fef08a;border:2px dashed #ca8a04;border-radius:5px;display:flex;align-items:center;justify-content:center;left:${f.x}%;top:${f.y}%;width:${fieldWidth};height:${fieldHeight};max-width:100%;overflow:hidden;`;
                let inputHtml='';

window.showStudentHomeworkHonorBoard = async function(period) {
  const cls = document.getElementById('stClass')?.value || window.currentStudentIdentity?.studentClass || '';

  const isVisible = (el) => {
    if (!el) return false;
    const style = window.getComputedStyle(el);
    return style.display !== 'none' && style.visibility !== 'hidden' &&
           el.getClientRects().length > 0;
  };
  const successSection = document.getElementById('stSuccess');
  const submitSection = document.getElementById('stSubmitArea');
  let box = null;
  if (isVisible(successSection)) {
    box = document.getElementById('studentHomeworkHonorBoardSuccess');

    });

    window.currentStudentIdentity = identity;
    const students = Array.isArray(data.students) ? data.students : [];

        <div style="font-size:38px">🏆✨</div>

          <button type="button" onclick="showStudentHomeworkHonorBoard('monthly')" style="padding:9px 14px;border:0;border-radius:10px;background:${selectedPeriod==='monthly'?'#92400e':'#fde68a'};color:${selectedPeriod==='monthly'?'white':'#78350f'};font-weight:bold">الشهرية</button>
          <button type="button" onclick="showStudentHomeworkHonorBoard('all')" style="padding:9px 14px;border:0;border-radius:10px;background:${selectedPeriod==='all'?'#92400e':'#fde68a'};color:${selectedPeriod==='all'?'white':'#78350f'};font-weight:bold">الإجمالية</button>
        </div>
      </div>
      ${students.length ? students.map((s,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:10px;margin:7px 0;background:${i===0?'#fef3c7':'white'};border:1px solid ${i===0?'#f59e0b':'#fde68a'};border-radius:12px">

  } catch (error) {
    box.innerHTML = '<span style="color:#b91c1c">تعذر تحميل لوحة الشرف: '+safeStudentResult(error.message || error)+'</span>';

window.submitStudentAnswers = async function(autoSubmit=false) {
    const identity=window.currentStudentIdentity;
    if(!identity||!identity.studentKey||!identity.pinHash||!window.currentStudentAttemptId){alert('انتهت جلسة التحقق. ارجع وأدخل الصف والاسم والرقم السري مرة أخرى.');return;}
    const btn=document.querySelector('#stSubmitArea button');
    const fields=Array.isArray(window.currentStudentWorksheet&&window.currentStudentWorksheet.fields)?window.currentStudentWorksheet.fields:[];
    if(!fields.length){alert('لا يمكن إرسال الواجب؛ لم يتم تحميل أسئلته بشكل صحيح.');return;}
    const answers={},unanswered=[];
    fields.forEach((f,index)=>{
        const input=document.getElementById(f.id);const value=input?String(input.value==null?'':input.value).trim():'';
        answers[f.id]=value;
        if(!value)unanswered.push(index+1);
    });
    if(unanswered.length&&!autoSubmit&&!window.__worksheetTimeExpired){
        alert('أكمل الإجابة عن جميع الأسئلة أولاً. الأسئلة غير المجابة: '+unanswered.join('، '));
        const first=document.getElementById(fields[unanswered[0]-1].id);if(first)first.focus();return;
    }
    if(btn){btn.disabled=true;btn.textContent=autoSubmit?'⏳ انتهى الوقت، جارٍ التسليم...':'⏳ جارٍ إرسال الإجابات...';}
    try{
        const callable=firebase.app().functions('us-central1').httpsCallable('submitStudentWorksheetAnswers');
        const response=await callable({
            worksheetId:new URLSearchParams(window.location.search).get('id'),
            attemptId:window.currentStudentAttemptId,schoolId:identity.schoolId,studentKey:identity.studentKey,
            pinHash:identity.pinHash,studentName:identity.studentName,studentClass:identity.studentClass,answers
        });
        if(!response||!response.data||response.data.success!==true)throw new Error('لم يؤكد الخادم حفظ الإجابات.');
        stopStudentWorksheetTimer();
        document.getElementById('stWorkspace').style.display='none';document.getElementById('stSubmitArea').style.display='none';
        document.getElementById('stSuccess').style.display='block';
        document.getElementById('stSuccess').insertAdjacentHTML('beforeend','<p style="color:#166534;font-weight:bold">تم تسجيل إجابتك. لا يمكن إعادة إرسال هذه الورقة مرة أخرى.</p>');
    }catch(error){
        console.error('Student answers submit error:',error);
        alert(error.message||'تعذر إرسال الإجابات.');
        if(btn){btn.disabled=false;btn.textContent='✅ إرسال الإجابات';}
    }
}

window.loadDailyChallenge=async function(){
 dailyChallengeClearTimer();
 const host=document.getElementById("dailyChallengeContent");
 host.textContent="⏳ جارٍ التحقق من بياناتك وتحميل تحدي اليوم...";
 try{
  const identity=await dailyChallengeIdentity();
  const response=await firebase.app().functions("us-central1").httpsCallable("getDailyChallenge")(identity);
  const data=response?.data||{};
  if(data.success!==true)throw new Error("لم يؤكد الخادم تحميل التحدي.");
  if(!data.found){
    dailyChallengeShowMessage(data.message||"لا يوجد تحدٍ منشور لفصلك اليوم. ترقب تحدي الغد! 🌟",false);
    return;
  }
  window.__dailyChallengeCurrent=data;
  if(data.attemptState==="submitted" || data.attemptState==="pending_review"){
    dailyChallengeRenderResult(data.attemptResult||{},data.challenge);
    return;
  }
  if(data.attemptState==="expired"){
    dailyChallengeShowMessage("انتهى وقت محاولتك اليومية. حاول مرة أخرى غدًا! 🔥",true);
    return;
  }
  if(data.state==="upcoming"){
    dailyChallengeShowMessage("⏰ لم يحن موعد فتح التحدي بعد. يبدأ في "+new Date(data.challenge.openAtMillis).toLocaleTimeString("ar-QA",{hour:"2-digit",minute:"2-digit"})+" بتوقيت قطر.",false);
    return;
  }
  if(data.state==="closed"){
    dailyChallengeShowMessage("انتهى وقت تحدي اليوم. انتظر تحدي الغد! 🌙",false);
    return;
  }
  dailyChallengeRenderIntro(data);
 }catch(error){
  console.error("Daily challenge load failed:",error);
  dailyChallengeShowMessage(error.message||"تعذر تحميل تحدي اليوم.",true);
 }
};

window.startDailyChallenge=async function(){

  const response=await firebase.app().functions("us-central1").httpsCallable("startDailyChallengeAttempt")(identity);
  const data=response?.data||{};

let questionHunterAvailabilitySequence = 0;
async function questionHunterResolveIdentity(){
 const cls=String(document.getElementById("stClass")?.value||"").trim();
 const name=String(document.getElementById("stName")?.value||"").trim();
 const pin=String(document.getElementById("stPin")?.value||"").trim();
 if(!cls||!name||!/^\d{4}$/.test(pin))return null;
 const response=await firebase.app().functions("us-central1").httpsCallable("getQuestionHunterStudentAvailability")({
  studentClass:cls,studentName:name,pin
 });
 const data=response?.data||{};
 if(data.success!==true||!data.identity)throw new Error("لم يتمكن النظام من التحقق من هوية الطالب.");
 window.__questionHunterIdentity=data.identity;
 return data;
}
window.questionHunterCheckAvailability = async function(){
 const button=document.getElementById("questionHunterLaunchBtn");
 const status=document.getElementById("questionHunterAvailabilityMsg");
 if(!button)return;
 const sequence=++questionHunterAvailabilitySequence;
 button.style.display="none";
 window.__questionHunterIdentity=null;
 const cls=String(document.getElementById("stClass")?.value||"").trim();
 const name=String(document.getElementById("stName")?.value||"").trim();
 const pin=String(document.getElementById("stPin")?.value||"").trim();
 if(!cls||!name||!pin){
  if(status){status.style.display="none";status.textContent="";}
  return;
 }
 if(!/^[0-9]{4}$/.test(pin)){
  if(status){status.style.display="block";status.textContent="أدخل الرقم السري المكوّن من أربعة أرقام للتحقق من اللعبة.";}
  return;
 }
 if(status){status.style.display="block";status.textContent="⏳ جارٍ التحقق من اللعبة المنشورة لشعبتك...";}
 try{
  const data=await questionHunterResolveIdentity();
  if(sequence!==questionHunterAvailabilitySequence)return;
  button.style.display=data.found===true?"block":"none";
  if(status){
   status.style.display=data.found===true?"none":"block";
   status.textContent=(data.message||"لا توجد لعبة منشورة لشعبتك اليوم.")+(data.dateKey?"\\nتاريخ اللعبة الذي يفحصه النظام: "+data.dateKey:"")+(data.otherDate?"\\nوجدنا لعبة سابقة بتاريخ: "+data.otherDate:"");
  }
 }catch(error){
  if(sequence!==questionHunterAvailabilitySequence)return;
  button.style.display="none";
  if(status){
   status.style.display="block";
   status.textContent=error.message||"تعذر التحقق من بيانات الطالب. راجع الرقم السري وحاول مرة أخرى.";
   status.style.background="#fef2f2";
   status.style.color="#991b1b";
  }
  console.warn("Question Hunter availability check:",error);
 }
};

 try{
  const verified=await questionHunterResolveIdentity();
  if(!verified)throw new Error("اختر الصف واسمك وأدخل الرقم السري أولاً.");
  if(verified.found!==true){questionHunterMessage("لا توجد لعبة منشورة لفصلك اليوم. ترقب اللعبة القادمة! 🎯",false);return;}
  const identity=verified.identity;
  const response=await firebase.app().functions("us-central1").httpsCallable("getActiveQuestionHunterGame")(identity);
  const data=response?.data||{};if(data.success!==true)throw Error("لم يؤكد الخادم تحميل اللعبة.");
  if(!data.found){questionHunterMessage(data.message||"لا توجد لعبة منشورة لفصلك اليوم.",false);return;}
  window.__questionHunterState={identity,game:data.game,session:null,sessionId:"",question:null};

window.questionHunterStart=async function(){
 const state=window.__questionHunterState;if(!state)return;
 questionHunterMessage("⏳ يتم تجهيز الأهداف...");
 try{
  const response=await firebase.app().functions("us-central1").httpsCallable("startQuestionHunterGame")(state.identity);
