const STUDENT_NAMES_BY_CLASS = {"السادس 2":["أحمد عمر احمد عبدالرحمن الجهرمى","احمد الامين احمد الامين","احمد على فالح الجمل","احمد غلام احمد تاج كاركشا","السمؤال عبدالمسامح الزين النور","الهادي سمير الحاج عبدالله","انس اشرف انيس شاهين","تميم المعتزبالله عادل احمد البحلس","جاسم احمد صالح عبدالله السحيقى","جاسم محمد فاضل الشقيرى المهندى","حمد محمد فاروق","خالد سعيد عبد الحميد عبد الغفار محمد","خالد عبدالعزيز","خالد محمد خالد القوربه","ريان احمد سفيان الجمل","ريان بشار حمزه","زياد بوحده","سليمان زياد سليمان عبدالخالق","صالح احمد عبدالقادر حموده","صالح عون علي محمد القمش","عمر يونس الشلوت","عناب معتصم اسامه عناب","فهد احمد ابراهيم حمد الطوالبة","مؤتمن منتصر يعقوب عبدالقادر احمد","مالك عزام ذياب عبدالمالك","محمد شوقي قاسم فاضل","محمد عبدالله","محمد عيسى احمد محمد الحمادى","محمد كريم محمد على حسن طه","مسعود احمد مسعود العبري","هزاع جمال علي الجعل","ياسين عماد مسعد حامد الصباغ","يحيى احمد عاطف عبدالسلام العبد"],"السادس 4":["أحمد يوسف أحمد عبد الله العبدلي","أواب ابوالقاسم حسن جادالله","احمد خليفة سالم المحروقي","الياس محمد زين دغمش","باسل عمار ياسر احمد محمود","براء فوزي بلدي","بلال محمد محمد محمد حسين","تميم عبدالله سلطان على العلى","حمزة امير السيد عثمان محمد","حمزه شادى عبدالكريم قاسم","خليفه محمد قائد علي العتولى","راشد احمد راشد على الشرشنى","ضياء الدين هشام النيل سعيد","عبدالله عبدالعزيز على ال شاهين السليطى","عبدالهادى سليمان الهادي اسحق","عمر محمد احمد حسين","غانم يحيى صالح عبدالله العبيدى","فهد عبدالعليم","فواز فيصل ادهام فيصل المهندى","كنان فادي مروان الرواشده","مالك محمد انس الفوال","محمد الخواض محمدالامين محمدنور","محمد سيف الرحمن عبدالمنعم حسين حنفى","محمد عبدالناصر ثابت الفتى","معاذ محمد احمد عواد احمد","ناجي ياسين العلي","نصر موفق نصر جوهره","هيثم علي محمد الرقب","ورد نورالدين العسلى","وليد عاقب فيصل على","يمان عمر محمدعبدالوهاب ابوشريعه","يوسف اشرف مصطفي محمد علي","يوسف عصام يوسف بابكر"],"السادس 6":["احمد علي حسن الصائغ","احمد محمد على سيد","بهاء محمد عبدالحميد الشاقلدي","تميم حسين زين عبدالناصر السعدى","حسام احمد جبريل حبيب","ريان بشير حسن الروسان","سعد ب window.populateStudentNames = function() {
  const cls = document.getElementById('stClass').value;
  const nameSelect = document.getElementById('stName');
  nameSelect.innerHTML = '';
  if (!cls || !STUDENT_NAMES_BY_CLASS[cls]) {
    nameSelect.disabled = true;
    nameSelect.innerHTML = '<option value="">-- اختر الصف أولاً --</option>';
    return;
  }
  nameSelect.disabled = false;
  nameSelect.innerHTML = '<option value="">-- اختر اسم الطالب --</option>';
  STUDENT_NAMES_BY_CLASS[cls].forEach(name => {
    const option = document.createElement('option');
    option.value = name; option.textContent = name;
    nameSelect.appendChild(option);
  });
};
// دوال الطالب
async function homeworkSha256(value) {
    const bytes = new TextEncoder().encode(String(value));
    const digest = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function homeworkNormalizeName(value) {
    return String(value || '').trim().replace(/\s+/g,' ').toLowerCase();
}
window.__worksheetTimerHandle = null;
window.__worksheetTimeExpired = false;
function stopStudentWorksheetTimer(){
    if(window.__worksheetTimerHandle){clearInterval(window.__worksheetTimerHandle);window.__worksheetTimerHandle=null;}
}
function runStudentWorksheetTimer(expiresAtMillis){
    stopStudentWorksheetTimer();
    const panel=document.getElementById('stTimerPanel');
    const value=document.getElementById('stTimerValue');
    if(!panel||!value||!Number.isFinite(Number(expiresAtMillis)))return;
    panel.style.display='block';
    const tick=()=>{
        const left=Math.max(0,Math.ceil((Number(expiresAtMillis)-Date.now())/1000));
        value.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
        if(left<=0){
            stopStudentWorksheetTimer();
            window.__worksheetTimeExpired=true;
            const msg=document.getElementById('stTimingMessage');
            if(msg){msg.style.display='block';msg.textContent='انتهى وقت المحاولة. جارٍ إرسال إجاباتك تلقائيًا.';}
            window.submitStudentAnswers(true);
        }
    };
    tick();window.__worksheetTimerHandle=setInterval(tick,1000);
}
window.startStudentWorksheet = async function() {
    const cls = document.getElementById('stClass').value;
    const name = document.getElementById('stName').value;
    const pin = (document.getElementById('stPin') && document.getElementById('stPin').value || '').trim();

    if(!/^\d{4}$/.test(pin)) return alert('أدخل الرقم السري المكوّن من 4 أرقام.');
    if(!window.currentStudentWorksheet || !window.currentStudentWorksheet.imageUrl) return alert('لم يتم تحميل صورة ورقة العمل بعد. يرجى تحديث الصفحة والمحاولة مرة أخرى.');
    const schoolId = String(window.currentStudentWorksheet.schoolId || 'global');
    const studentKey = await homeworkSha256(schoolId + '|' + cls + '|' + homeworkNormalizeName(name));
    const pinHash = await homeworkSha256(studentKey + '|' + pin);
    const worksheetId = new URLSearchParams(window.location.search).get('id');
    if (!worksheetId) return alert('تعذر تحديد ورقة العمل. افتح الرابط المرسل من المعلم مرة أخرى.');
    if(startBtn){startBtn.disabled=true;startBtn.textContent='⏳ جارٍ التحقق من الموعد والرقم السري...';}
    try {
        // يتحقق الخادم مباشرة من student_access عبر Admin SDK؛ لا نحتاج كتابة
        // سجل student_pin_checks من جهاز الطالب في كل محاولة.
        const callable=firebase.app().functions('us-central1').httpsCallable('startStudentWorksheetAttempt');
        const response=await callable({worksheetId,schoolId,studentKey,pinHash,studentName:name,studentClass:cls});
        const result=response&&response.data?response.data:{};
        if(result.success!==true)throw new Error('لم يؤكد الخادم بدء المحاولة.');
        window.currentStudentIdentity={schoolId,studentKey,pinHash,studentName:name,studentClass:cls};
        window.currentStudentAttemptId=String(result.attemptId||'');
        window.__worksheetTimeExpired=false;
        document.getElementById('stInfoForm').style.display='none';
        document.getElementById('stWorkspace').style.display='block';
        document.getElementById('stSubmitArea').style.display='block';
        if(result.expiresAtMillis)runStudentWorksheetTimer(Number(result.expiresAtMillis));
        const img=document.getElementById('stImg');
        img.onload=()=>{
            const fieldsDiv=document.getElementById('stFields');fieldsDiv.innerHTML='';
            window.currentStudentWorksheet.fields.forEach(f=>{
                const el=document.createElement('div');
                const renderedImage=document.getElementById('stImg');
                const editorWidth=Number(window.currentStudentWorksheet.editorImageWidth||0);
                const scale=(renderedImage&&editorWidth>0)?renderedImage.clientWidth/editorWidth:1;
                const fieldWidth=Number(f.wPct)>0?f.wPct+'%':(Number(f.w||0)*scale)+'px';
                const fieldHeight=Number(f.hPct)>0?f.hPct+'%':(Number(f.h||0)*scale)+'px';
                el.style.cssText=`position:absolute;box-sizing:border-box;background:#fef08a;border:2px dashed #ca8a04;border-radius:5px;display:flex;align-items:center;justify-content:center;left:${f.x}%;top:${f.y}%;width:${fieldWidth};height:${fieldHeight};max-width:100%;overflow:hidden;`;
                let inputHtml='';
                if(f.type==='short_text')inputHtml=`<input type="text" id="${f.id}" style="box-sizing:border-box;width:100%;height:100%;min-width:0;border:none;background:transparent;text-align:center;font-weight:bold;outline:none;font-size:clamp(10px,2.5vw,16px);">`;
                else if(f.type==='long_text')inputHtml=`<textarea id="${f.id}" style="box-sizing:border-box;width:100%;height:100%;min-width:0;border:none;background:transparent;resize:none;outline:none;padding:3px;font-size:clamp(10px,2.5vw,16px);"></textarea>`;
                else inputHtml=`<input type="text" id="${f.id}" style="box-sizing:border-box;width:100%;height:100%;min-width:0;border:none;background:transparent;text-align:center;font-weight:bold;outline:none;font-size:clamp(10px,2.5vw,16px);">`;
                el.innerHTML=inputHtml;fieldsDiv.appendChild(el);
            });
        };
        img.onerror=()=>{
            stopStudentWorksheetTimer();document.getElementById('stWorkspace').style.display='none';document.getElementById('stSubmitArea').style.display='none';document.getElementById('stInfoForm').style.display='block';
            document.getElementById('stTitle').innerText='❌ تعذر عرض الصورة. تحقق من رابط الصورة وصلاحيات Firebase Storage.';
            alert('تعذر تحميل صورة الورقة. قد يكون رابط Firebase Storage غير صالح أو لا يسمح بالوصول.');
        };
        img.src=window.currentStudentWorksheet.imageUrl;
    } catch(error) {
        console.error('Student worksheet start error:',error);
        alert(error.message||'تعذر بدء الاختبار.');
        if(startBtn){startBtn.disabled=false;startBtn.textContent='🚀 ابدأ الإجابة';}
    }
};

window.showMyHomeworkResults = async function(){
 const cls=document.getElementById('stClass').value, name=document.getElementById('stName').value;
 const pin=(document.getElementById('stPin')&&document.getElementById('stPin').value||'').trim();
 const box=document.getElementById('myHomeworkResults'); box.style.display='block';
 if(!cls||!name){box.innerHTML='<b style="color:#b91c1c">اختر الصف واسمك أولاً لعرض نتائجك.</b>';return;}
 if(!/^\d{4}$/.test(pin)){box.innerHTML='<b style="color:#b91c1c">أدخل رقمك السري المكوّن من أربعة أرقام للتحقق من هويتك.</b>';return;}
 box.innerHTML='⏳ جارٍ التحقق من هويتك وتحميل نتائجك...';
 try{
  // لا نعتمد على جلسة فتح ورقة العمل؛ يمكن للطالب التحقق مباشرة عند طلب عرض النتائج.
  let identity=window.currentStudentIdentity;
  if(!identity||identity.studentClass!==cls||identity.studentName!==name||identity.pinHash!==await homeworkSha256(identity.studentKey+'|'+pin)){
    const schoolId=String((window.currentStudentWorksheet&&window.currentStudentWorksheet.schoolId)||'global');
    const studentKey=await homeworkSha256(schoolId+'|'+cls+'|'+homeworkNormalizeName(name));
    const pinHash=await homeworkSha256(studentKey+'|'+pin);
    identity={schoolId,studentKey,pinHash,studentName:name,studentClass:cls};
  }
  const callable=firebase.app().functions('us-central1').httpsCallable('getStudentHomeworkResults');
  const response=await callable({studentKey:identity.studentKey,pinHash:identity.pinHash,schoolId:identity.schoolId,studentClass:identity.studentClass,studentName:identity.studentName});
  window.currentStudentIdentity=identity;
  const items=(response&&response.data&&Array.isArray(response.data.results))?response.data.results:[];
  if(!items.length){box.innerHTML='<b>لا توجد نتائج منشورة لك حتى الآن.</b>';return;}
  box.innerHTML='<h3 style="margin-top:0;color:#0f766e">نتائجك المعتمدة</h3>'+items.map(x=>'<div style="padding:9px;margin:7px 0;background:white;border-radius:8px;border:1px solid #99f6e4"><b>'+safeStudentResult(x.worksheetTitle)+'</b><div>الدرجة: <b>'+Number(x.score||0)+' / '+Number(x.maxScore||0)+'</b></div><div style="color:#047857;font-weight:bold">✔ تمت إضافة النقاط إلى رصيدك</div></div>').join('');
 }catch(e){box.innerHTML='<span style="color:#b91c1c">تعذر تحميل النتائج: '+safeStudentResult(e.message||e)+'</span>';}
};
function safeStudentResult(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}


window.showStudentHomeworkHonorBoard = async function(period) {
  const cls = document.getElementById('stClass')?.value || window.currentStudentIdentity?.studentClass || '';
  const name = document.getElementById('stName')?.value || window.currentStudentIdentity?.studentName || '';
  const pin = (document.getElementById('stPin')?.value || '').trim();

  // اختر صندوق العرض الموجود داخل القسم الظاهر فعلياً.
  // لا نستخدم أول ID مباشرة لأن صناديق الأقسام الأخرى موجودة في DOM وهي مخفية.
  const isVisible = (el) => {
    if (!el) return false;
    const style = window.getComputedStyle(el);
    return style.display !== 'none' && style.visibility !== 'hidden' &&
           el.getClientRects().length > 0;
  };
  const successSection = document.getElementById('stSuccess');
  const submitSection = document.getElementById('stSubmitArea');
  let box = null;
  if (isVisible(successSection)) {
    box = document.getElementById('studentHomeworkHonorBoardSuccess');
  } else if (isVisible(submitSection)) {
    box = document.getElementById('studentHomeworkHonorBoard');
  } else {
    box = document.getElementById('myHomeworkResults');
  }
  if (!box) return;
  box.style.display = 'block';
  if (!cls || !name) {
    box.innerHTML = '<b style="color:#b91c1c">اختر الصف واسمك أولاً.</b>';
    return;
  }
  if (!/^\d{4}$/.test(pin) && !window.currentStudentIdentity?.pinHash) {
    box.innerHTML = '<b style="color:#b91c1c">أدخل رقمك السري المكوّن من أربعة أرقام للتحقق من هويتك.</b>';
    return;
  }
  const selectedPeriod = period || 'weekly';
  box.innerHTML = '⏳ جارٍ التحقق من هويتك وتحميل لوحة الشرف...';
  try {
    let identity = window.currentStudentIdentity;
    const schoolId = String((window.currentStudentWorksheet && window.currentStudentWorksheet.schoolId) || identity?.schoolId || 'global');
    if (!identity || identity.studentClass !== cls || identity.studentName !== name ||
        (pin && identity.pinHash !== await homeworkSha256(identity.studentKey + '|' + pin))) {
      const studentKey = await homeworkSha256(schoolId + '|' + cls + '|' + homeworkNormalizeName(name));
      const pinHash = await homeworkSha256(studentKey + '|' + pin);
      identity = { schoolId, studentKey, pinHash, studentName: name, studentClass: cls };
    }
    const call = firebase.app().functions('us-central1').httpsCallable('getHomeworkHonorBoard');
    const response = await call({
      studentMode: true, period: selectedPeriod, classId: cls,
      schoolId: identity.schoolId, studentKey: identity.studentKey,
      pinHash: identity.pinHash, studentName: identity.studentName
    });
    const data = response?.data || {};
    if (data.success !== true) throw new Error('لم يؤكد الخادم تحميل لوحة الشرف.');
    window.currentStudentIdentity = identity;
    const students = Array.isArray(data.students) ? data.students : [];
    const periodLabel = selectedPeriod === 'weekly' ? 'الأسبوع الحالي' : selectedPeriod === 'monthly' ? 'الشهر الحالي' : 'الإجمالية';
    const medals = ['🥇','🥈','🥉'];
    box.innerHTML = `
      <div style="text-align:center">
        <div style="font-size:38px">🏆✨</div>
        <h3 style="color:#92400e;margin:5px 0 12px">لوحة الشرف في واجبات النقاط المنزلية</h3>
        <div style="font-weight:bold;color:#78350f;margin-bottom:12px">${periodLabel} — ${safeStudentResult(cls)}</div>
        <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:12px">
          <button type="button" onclick="showStudentHomeworkHonorBoard('weekly')" style="padding:9px 14px;border:0;border-radius:10px;background:${selectedPeriod==='weekly'?'#92400e':'#fde68a'};color:${selectedPeriod==='weekly'?'white':'#78350f'};font-weight:bold">الأسبوعية</button>
          <button type="button" onclick="showStudentHomeworkHonorBoard('monthly')" style="padding:9px 14px;border:0;border-radius:10px;background:${selectedPeriod==='monthly'?'#92400e':'#fde68a'};color:${selectedPeriod==='monthly'?'white':'#78350f'};font-weight:bold">الشهرية</button>
          <button type="button" onclick="showStudentHomeworkHonorBoard('all')" style="padding:9px 14px;border:0;border-radius:10px;background:${selectedPeriod==='all'?'#92400e':'#fde68a'};color:${selectedPeriod==='all'?'white':'#78350f'};font-weight:bold">الإجمالية</button>
        </div>
      </div>
      ${students.length ? students.map((s,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:10px;margin:7px 0;background:${i===0?'#fef3c7':'white'};border:1px solid ${i===0?'#f59e0b':'#fde68a'};border-radius:12px">
        <span style="font-size:25px;min-width:32px;text-align:center">${medals[i]||(''+(i+1))}</span>
        <b style="flex:1">${safeStudentResult(s.name)}</b>
        <strong style="color:#92400e">${Number(s.points||0)} نقطة</strong>
      </div>`).join('') : '<div style="text-align:center;padding:16px;background:white;border-radius:12px">لا توجد نقاط واجبات منزلية مسجلة لهذه الفترة حتى الآن.</div>'}
    `;
  } catch (error) {
    box.innerHTML = '<span style="color:#b91c1c">تعذر تحميل لوحة الشرف: '+safeStudentResult(error.message || error)+'</span>';
  }
};

window.submitStudentAnswers = async function(autoSubmit=false) {
    const identity=window.currentStudentIdentity;
    if(!identity||!identity.studentKey||!identity.pinHash||!window.currentStudentAttemptId){alert('انتهت جلسة التحقق. ارجع وأدخل الصف والاسم والرقم السري مرة أخرى.');return;}
    const btn=document.querySelector('#stSubmitArea button');
    const fields=Array.isArray(window.currentStudentWorksheet&&window.currentStudentWorksheet.fields)?window.currentStudentWorksheet.fields:[];
    if(!fields.length){alert('لا يمكن إرسال الواجب؛ لم يتم تحميل أسئلته بشكل صحيح.');return;}
    const answers={},unanswered=[];
    fields.forEach((f,index)=>{
        const input=document.getElementById(f.id);const value=input?String(input.value==null?'':input.value).trim():'';
        answers[f.id]=value;
        if(!value)unanswered.push(index+1);
    });
    if(unanswered.length&&!autoSubmit&&!window.__worksheetTimeExpired){
        alert('أكمل الإجابة عن جميع الأسئلة أولاً. الأسئلة غير المجابة: '+unanswered.join('، '));
        const first=document.getElementById(fields[unanswered[0]-1].id);if(first)first.focus();return;
    }
    if(btn){btn.disabled=true;btn.textContent=autoSubmit?'⏳ انتهى الوقت، جارٍ التسليم...':'⏳ جارٍ إرسال الإجابات...';}
    try{
        const callable=firebase.app().functions('us-central1').httpsCallable('submitStudentWorksheetAnswers');
        const response=await callable({
            worksheetId:new URLSearchParams(window.location.search).get('id'),
            attemptId:window.currentStudentAttemptId,schoolId:identity.schoolId,studentKey:identity.studentKey,
            pinHash:identity.pinHash,studentName:identity.studentName,studentClass:identity.studentClass,answers
        });
        if(!response||!response.data||response.data.success!==true)throw new Error('لم يؤكد الخادم حفظ الإجابات.');
        stopStudentWorksheetTimer();
        document.getElementById('stWorkspace').style.display='none';document.getElementById('stSubmitArea').style.display='none';
        document.getElementById('stSuccess').style.display='block';
        document.getElementById('stSuccess').insertAdjacentHTML('beforeend','<p style="color:#166534;font-weight:bold">تم تسجيل إجابتك. لا يمكن إعادة إرسال هذه الورقة مرة أخرى.</p>');
    }catch(error){
        console.error('Student answers submit error:',error);
        alert(error.message||'تعذر إرسال الإجابات.');
        if(btn){btn.disabled=false;btn.textContent='✅ إرسال الإجابات';}
    }
}
